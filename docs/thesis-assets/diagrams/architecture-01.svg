<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Sơ đồ kiến trúc tổng thể LuxeStay">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}
      .label{font:700 18px Arial,sans-serif;fill:#0f172a}
      .small{font:15px Arial,sans-serif;fill:#334155}
      .box{stroke:#1e3a8a;stroke-width:2;rx:16;ry:16}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" class="title">Kiến trúc tổng thể hệ thống LuxeStay</text>

  <rect x="60" y="115" width="220" height="105" class="box" fill="#dbeafe"/>
  <text x="170" y="155" text-anchor="middle" class="label">Trình duyệt</text>
  <text x="170" y="184" text-anchor="middle" class="small">Customer / Owner / Admin</text>

  <rect x="355" y="115" width="230" height="105" class="box" fill="#dcfce7"/>
  <text x="470" y="155" text-anchor="middle" class="label">Angular Frontend</text>
  <text x="470" y="184" text-anchor="middle" class="small">Route, form, state, UI</text>

  <rect x="660" y="95" width="250" height="145" class="box" fill="#fef3c7"/>
  <text x="785" y="135" text-anchor="middle" class="label">Spring Security</text>
  <text x="785" y="164" text-anchor="middle" class="small">JWT / Permission / Tenant</text>
  <text x="785" y="191" text-anchor="middle" class="small">REST + WebSocket</text>

  <rect x="980" y="115" width="160" height="105" class="box" fill="#fee2e2"/>
  <text x="1060" y="155" text-anchor="middle" class="label">Controller</text>
  <text x="1060" y="184" text-anchor="middle" class="small">REST API</text>

  <rect x="230" y="355" width="260" height="120" class="box" fill="#ede9fe"/>
  <text x="360" y="398" text-anchor="middle" class="label">Service nghiệp vụ</text>
  <text x="360" y="428" text-anchor="middle" class="small">Booking, payment, stay</text>
  <text x="360" y="451" text-anchor="middle" class="small">property, subscription</text>

  <rect x="595" y="355" width="250" height="120" class="box" fill="#e0f2fe"/>
  <text x="720" y="398" text-anchor="middle" class="label">Repository / JPA</text>
  <text x="720" y="428" text-anchor="middle" class="small">Validation and persistence</text>

  <rect x="950" y="350" width="190" height="130" class="box" fill="#f1f5f9"/>
  <text x="1045" y="392" text-anchor="middle" class="label">SQL Server</text>
  <text x="1045" y="422" text-anchor="middle" class="small">Production DB</text>
  <text x="1045" y="450" text-anchor="middle" class="small">H2 for tests</text>

  <rect x="180" y="645" width="250" height="105" class="box" fill="#fce7f3"/>
  <text x="305" y="685" text-anchor="middle" class="label">Payment Gateway</text>
  <text x="305" y="715" text-anchor="middle" class="small">VNPay / Simulator</text>

  <rect x="510" y="645" width="250" height="105" class="box" fill="#ecfccb"/>
  <text x="635" y="685" text-anchor="middle" class="label">File Storage</text>
  <text x="635" y="715" text-anchor="middle" class="small">Avatar / property images</text>

  <rect x="840" y="645" width="250" height="105" class="box" fill="#cffafe"/>
  <text x="965" y="685" text-anchor="middle" class="label">Flyway Migration</text>
  <text x="965" y="715" text-anchor="middle" class="small">Versioned schema</text>

  <path d="M280 168 H355" class="arrow"/>
  <path d="M585 168 H660" class="arrow"/>
  <path d="M910 168 H980" class="arrow"/>
  <path d="M1060 220 V300 H360 V355" class="arrow"/>
  <path d="M490 415 H595" class="arrow"/>
  <path d="M845 415 H950" class="arrow"/>
  <path d="M360 475 V600 H305 V645" class="arrow"/>
  <path d="M360 475 V600 H635 V645" class="arrow"/>
  <path d="M1045 480 V600 H965 V645" class="arrow"/>

  <text x="317" y="152" class="small">HTTPS</text>
  <text x="612" y="152" class="small">JSON / JWT</text>
  <text x="936" y="152" class="small">REST</text>
  <text x="515" y="402" class="small">domain calls</text>
  <text x="870" y="402" class="small">SQL</text>
</svg>
