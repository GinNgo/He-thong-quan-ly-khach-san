spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: test_secret_for_unit_test_only_do_not_use_in_prod
  expiration: 86400000
  refresh-expiration: 604800000

payment:
  provider-recovery:
    enabled: false
  demo:
    enabled: true
    signing-secret: test_demo_payment_signing_secret_at_least_32_chars
  vnpay:
    tmn-code: test_code
    hash-secret: test_hash
    url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

server:
  port: 8080

app:
  auth:
    refresh-cookie-secure: false
  mail:
    registration-enabled: false
    email-verification-enabled: false
  location-import:
    enabled: false
  demo-data:
    enabled: false
  accommodation-import:
    enabled: false
