spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:e2edb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: 8080

app:
  auth:
    password-reset:
      ttl-minutes: 30
      rate-window-minutes: 15
      max-ip-requests: 5
      max-email-requests: 3
  mail:
    password-reset-enabled: false
    password-reset-url: http://localhost:4200/reset-password
  accommodation-import:
    enabled: false
  location-import:
    enabled: true
    file-path: ${LOCATION_IMPORT_FILE_PATH:}
    resource: ${LOCATION_IMPORT_RESOURCE:classpath:data/locations.json}
    current-province-resource: ${CURRENT_PROVINCE_IMPORT_RESOURCE:classpath:data/provinces-current-34.json}
    landmark-resource: ${LANDMARK_IMPORT_RESOURCE:classpath:data/landmarks.json}
    cleanup-obsolete: false
  demo-data:
    enabled: true
    legacy-seed: true
    nationwide-property-seed: false
    allow-public-demo: true
