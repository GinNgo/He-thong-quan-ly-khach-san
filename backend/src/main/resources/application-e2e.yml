spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:e2edb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: 8080

app:
  reservation-amendment:
    cutoff-minutes: 5
    quote-ttl-minutes: 2
    default-arrival-time: 14:00
    property-zone-id: Asia/Ho_Chi_Minh
  auth:
    password-reset:
      ttl-minutes: 30
      rate-window-minutes: 15
      max-ip-requests: 5
      max-email-requests: 3
  mail:
    password-reset-enabled: false
    password-reset-url: http://localhost:4200/reset-password
  accommodation-import:
    enabled: false
