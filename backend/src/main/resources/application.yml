spring:
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    # SQL Server Configuration
    url: ${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=HotelDB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:8080" # Placeholder

# Payment Gateway Configurations
payment:
  property:
    encryption-key: ${PROPERTY_PAYMENT_ENCRYPTION_KEY:${JWT_SECRET}}
  demo:
    enabled: ${PAYMENT_DEMO_ENABLED:false}
    signing-secret: ${PAYMENT_DEMO_SIGNING_SECRET:${JWT_SECRET}}
    base-url: ${PAYMENT_DEMO_BASE_URL:http://localhost:4200/payment-simulator}
  sandbox:
    enabled: ${PAYMENT_SANDBOX_ENABLED:true}
  production:
    enabled: ${PAYMENT_PRODUCTION_ENABLED:false}
    approved: ${PAYMENT_PRODUCTION_APPROVED:false}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:4200/payment-result}
    version: 2.1.0
    command: pay
  zalopay:
    app-id: ${ZALOPAY_APP_ID:}
    key1: ${ZALOPAY_KEY1:}
    key2: ${ZALOPAY_KEY2:}
    create-url: ${ZALOPAY_CREATE_URL:https://sb-openapi.zalopay.vn/v2/create}
    query-url: ${ZALOPAY_QUERY_URL:https://sb-openapi.zalopay.vn/v2/query}
    refund-url: ${ZALOPAY_REFUND_URL:https://sb-openapi.zalopay.vn/v2/refund}
    refund-query-url: ${ZALOPAY_REFUND_QUERY_URL:https://sb-openapi.zalopay.vn/v2/query_refund}
    redirect-url: ${ZALOPAY_REDIRECT_URL:http://localhost:4200/payment-result}
    callback-url: ${ZALOPAY_CALLBACK_URL:http://localhost:8080/api/payments/zalopay-callback}
  provider-recovery:
    enabled: ${PAYMENT_PROVIDER_RECOVERY_ENABLED:true}
    scan-ms: ${PAYMENT_PROVIDER_RECOVERY_SCAN_MS:60000}
    minimum-age-ms: ${PAYMENT_PROVIDER_RECOVERY_MINIMUM_AGE_MS:60000}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

app:
  auth:
    # Must be true behind HTTPS in production; false supports local HTTP development only.
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    password-reset:
      ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
      rate-window-minutes: ${PASSWORD_RESET_RATE_WINDOW_MINUTES:15}
      max-ip-requests: ${PASSWORD_RESET_MAX_IP_REQUESTS:5}
      max-email-requests: ${PASSWORD_RESET_MAX_EMAIL_REQUESTS:3}
  mail:
    sender-name: ${MAIL_SENDER_NAME:LuxeStay}
    registration-enabled: ${REGISTRATION_EMAIL_ENABLED:true}
    email-verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:4200/verify-email}
    password-reset-enabled: ${PASSWORD_RESET_EMAIL_ENABLED:true}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:4200/reset-password}
    login-url: ${REGISTRATION_LOGIN_URL:http://localhost:4200/login}
    outbox:
      enabled: ${MAIL_OUTBOX_ENABLED:true}
      delivery-enabled: ${MAIL_OUTBOX_DELIVERY_ENABLED:false}
      scan-ms: ${MAIL_OUTBOX_SCAN_MS:30000}
      base-backoff-seconds: ${MAIL_OUTBOX_BASE_BACKOFF_SECONDS:30}
      max-backoff-seconds: ${MAIL_OUTBOX_MAX_BACKOFF_SECONDS:3600}
      max-attempts: ${MAIL_OUTBOX_MAX_ATTEMPTS:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
  observability:
    scheduler:
      pool-size: ${OBSERVABILITY_SCHEDULER_POOL_SIZE:2}
  location-import:
    enabled: true
    resource: ${LOCATION_IMPORT_RESOURCE:classpath:data/locations.json}
    current-province-resource: ${CURRENT_PROVINCE_IMPORT_RESOURCE:classpath:data/provinces-current-34.json}
    current-ward-resource: ${CURRENT_WARD_IMPORT_RESOURCE:classpath:data/wards-current-34.json}
    landmark-resource: ${LANDMARK_IMPORT_RESOURCE:classpath:data/landmarks.json}
    cleanup-obsolete: false
  e2e-fixtures:
    enabled: false
  reservation-hold:
    ttl-minutes: ${RESERVATION_HOLD_TTL_MINUTES:15}
    expiry-scan-ms: ${RESERVATION_HOLD_EXPIRY_SCAN_MS:60000}
  demo-data:
    enabled: true
    legacy-seed: false
    nationwide-property-seed: true
    coverage-mode: STANDARD
    properties-per-province: 5
    properties-per-ward: 1
    max-total-properties: 5000
    batch-size: 50
    allow-public-demo: true
  accommodation-import:
    enabled: true
    provider: NOMINATIM
    max-results-per-batch: 100
    request-delay-ms: 1000
    auto-publish: false
  ai:
    gemini:
      api-key: ${LUXESTAY_AI_GEMINI_API_KEY:${GEMINI_API_KEY:}}
      models: ${GEMINI_MODELS:gemini-3.6-flash,gemini-3.5-flash,gemini-flash-latest,gemini-2.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}

social:
  facebook:
    app-id: ${FACEBOOK_APP_ID:}
    app-secret: ${FACEBOOK_APP_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
