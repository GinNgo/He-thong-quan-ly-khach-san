spring:
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    # SQL Server Configuration
    url: ${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=HotelDB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:8080" # Placeholder

# Payment Gateway Configurations
payment:
  property:
    encryption-key: ${PROPERTY_PAYMENT_ENCRYPTION_KEY:${JWT_SECRET}}
  demo:
    enabled: ${PAYMENT_DEMO_ENABLED:false}
    signing-secret: ${PAYMENT_DEMO_SIGNING_SECRET:${JWT_SECRET}}
    base-url: ${PAYMENT_DEMO_BASE_URL:http://localhost:4200/payment-simulator}
  sandbox:
    enabled: ${PAYMENT_SANDBOX_ENABLED:true}
  production:
    enabled: ${PAYMENT_PRODUCTION_ENABLED:false}
    approved: ${PAYMENT_PRODUCTION_APPROVED:false}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:4200/payment-result}
    version: 2.1.0
    command: pay
  momo:
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    create-url: ${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
    query-url: ${MOMO_QUERY_URL:https://test-payment.momo.vn/v2/gateway/api/query}
    refund-url: ${MOMO_REFUND_URL:https://test-payment.momo.vn/v2/gateway/api/refund}
    refund-query-url: ${MOMO_REFUND_QUERY_URL:https://test-payment.momo.vn/v2/gateway/api/refund/query}
    redirect-url: ${MOMO_REDIRECT_URL:http://localhost:4200/payment-result}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/payments/momo-ipn}
    request-type: captureWallet
  zalopay:
    app-id: ${ZALOPAY_APP_ID:}
    key1: ${ZALOPAY_KEY1:}
    key2: ${ZALOPAY_KEY2:}
    create-url: ${ZALOPAY_CREATE_URL:https://sb-openapi.zalopay.vn/v2/create}
    query-url: ${ZALOPAY_QUERY_URL:https://sb-openapi.zalopay.vn/v2/query}
    refund-url: ${ZALOPAY_REFUND_URL:https://sb-openapi.zalopay.vn/v2/refund}
    refund-query-url: ${ZALOPAY_REFUND_QUERY_URL:https://sb-openapi.zalopay.vn/v2/query_refund}
    redirect-url: ${ZALOPAY_REDIRECT_URL:http://localhost:4200/payment-result}
    callback-url: ${ZALOPAY_CALLBACK_URL:http://localhost:8080/api/payments/zalopay-callback}
  provider-recovery:
    enabled: ${PAYMENT_PROVIDER_RECOVERY_ENABLED:true}
    scan-ms: ${PAYMENT_PROVIDER_RECOVERY_SCAN_MS:60000}
    minimum-age-ms: ${PAYMENT_PROVIDER_RECOVERY_MINIMUM_AGE_MS:60000}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

app:
  staff-booking:
    quote-ttl-minutes: ${STAFF_BOOKING_QUOTE_TTL_MINUTES:2}
  auth:
    # Must be true behind HTTPS in production; false supports local HTTP development only.
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    login:
      audit-secret: ${LOGIN_AUDIT_SECRET:${JWT_SECRET}}
      window-minutes: ${LOGIN_RATE_WINDOW_MINUTES:15}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
      max-account-failures: ${LOGIN_MAX_ACCOUNT_FAILURES:5}
      max-ip-failures: ${LOGIN_MAX_IP_FAILURES:20}
    password-reset:
      ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
      rate-window-minutes: ${PASSWORD_RESET_RATE_WINDOW_MINUTES:15}
      max-ip-requests: ${PASSWORD_RESET_MAX_IP_REQUESTS:5}
      max-email-requests: ${PASSWORD_RESET_MAX_EMAIL_REQUESTS:3}
    email-verification:
      ttl-minutes: ${EMAIL_VERIFICATION_TTL_MINUTES:60}
      rate-window-minutes: ${EMAIL_VERIFICATION_RATE_WINDOW_MINUTES:15}
      max-ip-requests: ${EMAIL_VERIFICATION_MAX_IP_REQUESTS:8}
      max-user-requests: ${EMAIL_VERIFICATION_MAX_USER_REQUESTS:3}
  mail:
    password-reset-enabled: ${PASSWORD_RESET_EMAIL_ENABLED:true}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:4200/reset-password}
    email-verification-enabled: ${EMAIL_VERIFICATION_ENABLED:true}
    email-verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:4200/verify-email}
    payment-receipt-enabled: ${PAYMENT_RECEIPT_EMAIL_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  reservation-hold:
    ttl-minutes: ${RESERVATION_HOLD_TTL_MINUTES:15}
    expiry-scan-ms: ${RESERVATION_HOLD_EXPIRY_SCAN_MS:60000}
  reservation-amendment:
    cutoff-minutes: ${RESERVATION_AMENDMENT_CUTOFF_MINUTES:1440}
    quote-ttl-minutes: ${RESERVATION_AMENDMENT_QUOTE_TTL_MINUTES:15}
    default-arrival-time: ${RESERVATION_AMENDMENT_DEFAULT_ARRIVAL_TIME:14:00}
    property-zone-id: ${RESERVATION_AMENDMENT_PROPERTY_ZONE_ID:Asia/Ho_Chi_Minh}
  stay-check-in:
    property-zone-id: ${STAY_CHECK_IN_PROPERTY_ZONE_ID:Asia/Ho_Chi_Minh}
    default-arrival-time: ${STAY_CHECK_IN_DEFAULT_ARRIVAL_TIME:14:00}
    default-departure-time: ${STAY_CHECK_IN_DEFAULT_DEPARTURE_TIME:12:00}
    early-window-minutes: ${STAY_CHECK_IN_EARLY_WINDOW_MINUTES:0}
    demo-early-window-minutes: ${STAY_CHECK_IN_DEMO_EARLY_WINDOW_MINUTES:5}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:4200}
  observability:
    scheduler:
      pool-size: ${OBSERVABILITY_SCHEDULER_POOL_SIZE:2}
  location-import:
    enabled: true
    file-path: ${LOCATION_IMPORT_FILE_PATH:}
    resource: ${LOCATION_IMPORT_RESOURCE:classpath:data/locations.json}
    current-province-resource: ${CURRENT_PROVINCE_IMPORT_RESOURCE:classpath:data/provinces-current-34.json}
    landmark-resource: ${LANDMARK_IMPORT_RESOURCE:classpath:data/landmarks.json}
    cleanup-obsolete: false
  demo-data:
    enabled: false
    legacy-seed: false
    nationwide-property-seed: false
    coverage-mode: STANDARD
    properties-per-province: 5
    properties-per-ward: 1
    max-total-properties: 5000
    batch-size: 50
    allow-public-demo: false
  accommodation-import:
    enabled: true
    provider: NOMINATIM
    max-results-per-batch: 100
    request-delay-ms: 1000
    auto-publish: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
